<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Login</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef7ee;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .login-box {
        background: white;
        width: 380px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
        text-align: center;
        color: #2e7d32;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 11px;
        margin-top: 7px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        border: none;
        border-radius: 8px;
        background: #2e7d32;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1b5e20;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
    }

    .register-link a {
        color: #2e7d32;
        text-decoration: none;
        font-weight: bold;
    }

    .error {
        background: #ffebee;
        color: #c62828;
        padding: 10px;
        border-radius: 7px;
        margin-bottom: 15px;
    }
</style>
```

</head>

<body>

<div class="login-box">

```
<h1>🌱 Farmer Login</h1>

<p class="subtitle">
    Login to your Crop Risk Monitoring System
</p>

{% if error %}
    <div class="error">
        {{ error }}
    </div>
{% endif %}

<form method="POST">

    <label>Email</label>
    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label>Password</label>
    <input
        type="password"
        name="password"
        placeholder="Enter your password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<div class="register-link">
    Don't have an account?
    <a href="{{ url_for('register') }}">Create account</a>
</div>
```

</div>

</body>
</html>
